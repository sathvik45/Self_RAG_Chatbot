name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: selfrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name selfrag-smoke -p 8000:8000 selfrag:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then ok=1; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "container never became healthy"
            docker logs selfrag-smoke
            exit 1
          fi
          docker stop selfrag-smoke

  # Publishes the image to GHCR on every merge to main. Works out of the box
  # with the repo's built-in GITHUB_TOKEN - no secrets to set up. If pushes
  # get a permissions error, enable "Read and write permissions" for the
  # GITHUB_TOKEN under Settings > Actions > General > Workflow permissions.
  publish:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase image names, but github.repository preserves
      # the repo's actual casing (Self_RAG_Chatbot) - lowercase it here.
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: auto-deploy to a Hugging Face Space (Docker SDK) on every merge
  # to main. Skipped automatically until you set these up:
  #   1. Create a Space at huggingface.co/new-space with SDK = Docker.
  #   2. Add repo secrets: HF_TOKEN (a HF token with write access to the Space)
  #      and HF_SPACE (e.g. "your-username/your-space-name").
  deploy-hf-space:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force space HEAD:main

  # Optional: auto-deploy to Google Cloud Run on every merge to main. Skipped
  # automatically until you set these up:
  #   1. Create a GCP project; enable the Cloud Run API and Artifact Registry API.
  #   2. Create an Artifact Registry Docker repo named "selfrag" in a Cloud
  #      Run free-tier region (e.g. us-central1).
  #   3. Create a service account with roles: Cloud Run Admin, Artifact
  #      Registry Writer, Service Account User. Download its JSON key.
  #   4. Add repo secrets: GCP_SA_KEY (the JSON key contents) and
  #      GROQ_API_KEY (passed through as the running service's env var).
  #   5. Add repo variables: GCP_PROJECT_ID and GCP_REGION (e.g. us-central1).
  # --max-instances=1 matches the single-instance limitation documented in
  # the README (in-memory session store + FAISS index aren't safe to share
  # across multiple replicas). --min-instances=0 lets it scale to zero (free)
  # when idle.
  deploy-cloud-run:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/selfrag/selfrag
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: selfrag
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/selfrag/selfrag:${{ github.sha }}
          env_vars: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          flags: --port=8000 --allow-unauthenticated --min-instances=0 --max-instances=1
